<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>ACCESS DENIED — HUD</title>
  <link rel="stylesheet" href="ad.css">
  <style>
    /* Reticle */
    #reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      pointer-events: none;
    }
    #reticle::before, #reticle::after {
      content: "";
      position: absolute;
      background: rgba(215, 228, 234, 0.85);
    }
    #reticle::before { left: 6px; top: 0; width: 2px; height: 14px; }
    #reticle::after { left: 0; top: 6px; width: 14px; height: 2px; }
    #reticle.active::before, #reticle.active::after { background: var(--cyan); }

    /* Top bar */
    #top {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }
    #objbox { max-width: 46vw; }
    #objective {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--cyan);
      margin-top: 5px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    #phases {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .phase {
      width: 26px;
      height: 4px;
      border-radius: 2px;
      background: rgba(120, 190, 220, 0.18);
    }
    .phase.done { background: var(--green); }
    .phase.now { background: var(--cyan); }
    #topbtns { display: flex; gap: 8px; pointer-events: auto; }
    #topbtns .btn { padding: 8px 14px; font-size: 12.5px; font-family: var(--mono); }
    #cluecount { color: var(--amber); }

    /* Prompt */
    #prompt {
      position: fixed;
      left: 50%;
      top: 58%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 14.5px;
      color: var(--ink);
      background: rgba(10, 15, 20, 0.78);
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 8px 16px;
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #prompt.show { opacity: 1; }
    #prompt b { color: var(--cyan); font-weight: 700; }

    /* Toasts */
    #toasts {
      position: fixed;
      top: max(64px, calc(env(safe-area-inset-top) + 52px));
      right: max(18px, env(safe-area-inset-right));
      display: grid;
      gap: 8px;
      justify-items: end;
      pointer-events: none;
    }
    .toast {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ink);
      background: rgba(10, 15, 20, 0.85);
      border: 1.5px solid var(--cyan-dim);
      border-left: 3px solid var(--cyan);
      border-radius: 6px;
      padding: 9px 14px;
      max-width: 340px;
      animation: toastin 0.25s ease, toastout 0.4s ease 3.4s forwards;
    }
    @keyframes toastin { from { opacity: 0; transform: translateX(16px); } }
    @keyframes toastout { to { opacity: 0; transform: translateY(-6px); } }

    /* Journal */
    #journal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(5, 8, 12, 0.82);
      pointer-events: auto;
    }
    #journal.open { display: grid; }
    #journal .panel {
      width: min(640px, 92vw);
      max-height: 80vh;
      overflow-y: auto;
      padding: 22px 26px;
      animation: rise 0.25s ease both;
    }
    .entry { border-left: 2px solid var(--line); padding: 2px 0 2px 14px; margin: 14px 0; }
    .entry .etitle { font-family: var(--mono); font-size: 12px; color: var(--amber); letter-spacing: 0.1em; }
    .entry .etext { font-size: 14px; line-height: 1.6; color: var(--ink); margin-top: 4px; }
    .empty { font-family: var(--mono); color: var(--dim); font-size: 13px; }

    /* Pause */
    #pause {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(5, 8, 12, 0.86);
      pointer-events: auto;
    }
    #pause.open { display: grid; }
    #pause .panel {
      width: min(380px, 90vw);
      padding: 26px 28px;
      animation: rise 0.25s ease both;
      display: grid;
      gap: 10px;
    }
    #pause h2 { margin: 2px 0 10px; font-family: var(--mono); font-size: 18px; letter-spacing: 0.2em; color: var(--cyan); }
    .srow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--dim);
    }
    input[type="range"] { width: 160px; accent-color: var(--cyan); }
    body.terminal-mode #reticle, body.terminal-mode #top, body.terminal-mode #prompt { display: none; }
    /* Narrow viewports: same sizes, tighter footprint — no shrinking type. */
    @media (max-width: 640px) {
      #objbox { max-width: 56vw; }
      #objective { font-size: 12px; }
      #topbtns .btn { padding: 7px 10px; font-size: 11px; }
      #toasts { max-width: 60vw; }
      .toast { max-width: 100%; font-size: 12px; }
    }
    @media (max-height: 420px) {
      #top { top: 8px; }
      #prompt { top: 62%; font-size: 13px; }
    }
  </style>
</head>
<body class="loading">
  <div id="reticle"></div>

  <header id="top">
    <div id="objbox">
      <div class="cap">OBJECTIVE</div>
      <div id="objective">—</div>
      <div id="phases">
        <span class="phase" data-p="trace"></span>
        <span class="phase" data-p="override"></span>
        <span class="phase" data-p="grid"></span>
        <span class="phase" data-p="control"></span>
      </div>
    </div>
    <div id="topbtns">
      <button class="btn" id="btn-journal">JOURNAL <span id="cluecount" class="mono">0</span></button>
      <button class="btn" id="btn-pause" data-webui-touch>ESC</button>
    </div>
  </header>

  <div id="prompt"></div>
  <div id="toasts"></div>

  <div id="journal">
    <div class="panel">
      <div class="cap">DISCOVERY JOURNAL</div>
      <div id="journal-list"><p class="empty">No findings yet. Read logs and notes with E.</p></div>
      <div style="margin-top:16px"><button class="btn" id="btn-journal-close">CLOSE (TAB)</button></div>
    </div>
  </div>

  <div id="pause">
    <div class="panel">
      <h2>PAUSED</h2>
      <button class="btn primary" id="btn-resume">RESUME</button>
      <div class="srow"><span>Mouse sensitivity</span><input type="range" id="set-sens" min="0.3" max="3" step="0.1" value="1"></div>
      <div class="srow"><span>Master volume</span><input type="range" id="set-vol" min="0" max="1" step="0.05" value="0.8"></div>
      <button class="btn" id="btn-restart">RESTART INVESTIGATION</button>
      <button class="btn" id="btn-menu">MAIN MENU</button>
    </div>
  </div>

  <div id="loader" aria-hidden="true"><span>LOADING…</span></div>
  <script src="hud.js"></script>
</body>
</html>
