<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>3D HUD</title>
  <link rel="stylesheet" href="hud3d.css">
</head>
<body class="loading">
  <!-- window.Godot is injected by the addon: no <script src> for it. -->
  <!-- Look zone: the whole screen, underneath the controls. Swipes on it turn the camera. -->
  <div id="look-zone" data-webui-touch></div>

  <div id="hint" class="chip">Swipe anywhere on the open screen to look around</div>

  <div id="telemetry" class="panel">
    <div class="cap">GODOT TELEMETRY</div>
    <div class="grid">
      <span>look</span><b id="t-swipe">idle</b>
      <span>yaw</span><b id="t-yaw">--</b>
      <span>pitch</span><b id="t-pitch">--</b>
      <span>speed</span><b id="t-speed">--</b>
      <span>floor</span><b id="t-floor">--</b>
      <span>fps</span><b id="t-fps">--</b>
    </div>
  </div>

  <div id="topbar">
    <button id="btn-menu" class="chip btn" data-webui-touch hidden>Menu</button>
    <button id="btn-camera" class="chip btn" data-webui-touch>Camera settings</button>
  </div>

  <div id="camera-panel" class="panel" data-webui-touch hidden>
    <div class="cap">CAMERA</div>
    <label for="sensitivity">Swipe sensitivity <b id="sens-value">1.0x</b></label>
    <input id="sensitivity" type="range" min="0.2" max="3" step="0.1" value="1">
    <div class="row">
      <button id="invert-x" class="toggle" aria-pressed="false">Invert X</button>
      <button id="invert-y" class="toggle" aria-pressed="false">Invert Y</button>
    </div>
  </div>

  <div id="stick-zone" data-webui-touch>
    <div id="stick">
      <div id="knob"></div>
    </div>
  </div>

  <button id="btn-jump" class="round" data-webui-touch>JUMP</button>

  <!-- Full-screen cover: visible while the page loads or Godot swaps scenes (body.loading),
       fades out when the first Godot state arrives. -->
  <div id="loader" aria-hidden="true"><span>Loading…</span></div>

  <script src="hud3d.js"></script>
</body>
</html>
