<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Lumen Hollow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="loading">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-glim" viewBox="0 0 24 24"><path d="M12 2l4.5 7L12 22 7.5 9z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13c0 .9 1 1.5 1.8 1L20 13c.8-.5.8-1.6 0-2.1L9.8 4.5C9 4 8 4.6 8 5.5z"/></symbol>
      <symbol id="i-flare" viewBox="0 0 24 24"><path d="M12 2c1 4-1 5-1 8a4 4 0 0 0 8 .5c2 3-1 10-7 12 6-1 7-6 5-9-1 1.5-3 1.6-4 .3 1.6-2.6.4-5.4-1-11.8z"/><path d="M10 22c-4-2-6-6-4.5-10C6.6 14 8 15.6 9.7 16c-.4-2.5 1-4.3 3.3-5-2 3.2-3.6 7.3-3 11z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div id="vignette"></div>

  <header id="top">
    <div class="side left">
      <div id="glow" class="chip"><svg class="glim"><use href="#i-glim"/></svg><b id="glow-n">0</b><span>/ <i id="glow-total">8</i></span></div>
      <div id="hp"><i></i><i></i><i></i><i></i><i></i></div>
      <div id="debug" class="debug" hidden><span id="debug-line"></span></div>
    </div>
    <div id="timer" class="chip">0:00</div>
    <div class="side right">
      <button id="btn-pause" class="iconbtn" data-webui-touch aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
    </div>
  </header>

  <div id="toast"><small id="toast-kicker">THE HOLLOW</small><b id="toast-text">Gather the glimmers</b></div>

  <!-- Showcase moments (Godot one-shot events fill these in): a seed pinged at the pickup spot,
       the gate-awake banner, a right-edge nudge while the gate is open, and the victory flash. -->
  <div id="awake" hidden><small>THE LAST SEED</small><b>The gate awakens</b></div>
  <div id="gate-hint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5l8 7-8 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div id="flash" aria-hidden="true"></div>

  <div id="stick-zone" data-webui-touch>
    <div id="stick"><div id="knob"></div></div>
  </div>

  <div id="actions">
    <button id="btn-flare" class="act flare" data-webui-touch aria-label="Flare">
      <svg><use href="#i-flare"/></svg>
      <span>FLARE</span>
      <i id="flare-pips"><b class="on"></b><b class="on"></b><b class="on"></b></i>
    </button>
    <button id="btn-jump" class="act jump" data-webui-touch aria-label="Jump">
      <svg><use href="#i-play"/></svg>
      <span>JUMP</span>
    </button>
  </div>

  <div id="pause" hidden>
    <div class="card" data-webui-touch>
      <small>PAUSED</small>
      <h2>Catch your breath</h2>
      <div class="settings">
        <div class="row"><span>Sound</span><button id="btn-sfx" class="toggle" aria-pressed="true">On</button></div>
        <div class="row"><span>Difficulty</span>
          <span class="seg" id="seg-difficulty"><button data-value="easy">Easy</button><button data-value="normal">Normal</button><button data-value="hard">Hard</button></span>
        </div>
      </div>
      <button id="btn-resume" class="cta"><svg><use href="#i-play"/></svg>Resume</button>
      <div class="row2">
        <button id="btn-restart" class="ghost">Restart</button>
        <button id="btn-menu" class="ghost">Menu</button>
      </div>
    </div>
  </div>

  <div id="results" hidden>
    <div class="card wide" data-webui-touch>
      <small id="results-kicker">THE GATE AWAKENS</small>
      <h2>Grove Complete</h2>
      <p id="r-verdict" class="verdict"></p>
      <div class="stats">
        <div class="stat"><b id="r-time">0:00.0</b><small>time</small></div>
        <div class="stat"><b id="r-glims">8/8</b><small>seeds</small></div>
        <div class="stat"><b id="r-hits">0</b><small>hits taken</small></div>
      </div>
      <p id="r-best" class="best"></p>
      <button id="btn-again" class="cta">Play again</button>
      <div class="row2">
        <button id="btn-next" class="ghost">Next: Deep Hollow</button>
        <button id="btn-results-menu" class="ghost">Menu</button>
      </div>
    </div>
  </div>

  <div id="ko" hidden>
    <b>K.O.</b>
    <small>The hollow rekindles you...</small>
  </div>

  <!-- Full-screen cover: visible while the page loads or Godot swaps scenes (body.loading),
       fades out when the first Godot state arrives. -->
  <div id="loader" aria-hidden="true"><span>Loading…</span></div>

  <script src="hud.js"></script>
</body>
</html>
