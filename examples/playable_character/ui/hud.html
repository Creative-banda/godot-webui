<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Game HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2 0 3.6 1.1 4.6 2.7h2c1-1.6 2.6-2.7 4.6-2.7 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></symbol>
      <symbol id="i-jump" viewBox="0 0 24 24"><path d="M12 3l8 9h-5v9H9v-9H4z"/></symbol>
      <symbol id="i-slash" viewBox="0 0 24 24"><path d="M4 20L18.5 5.5l-.8-2.7 2.7.8L21.2 6.3 6.7 20.8z M3 17l4 4-4 1z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M8 5l8 7-8 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div id="vignette"></div>

  <!-- Godot -> HTML: everything below is rendered from the "state" message. -->
  <div id="vitals" class="glass">
    <svg class="heart"><use href="#i-heart"/></svg>
    <div class="vbody">
      <div class="vrow"><span class="cap">HEALTH</span><span id="hp-text" class="num">--</span></div>
      <div class="track"><div id="hp-trail"></div><div id="hp-fill"></div><div class="ticks"></div></div>
    </div>
    <div id="floaters"></div>
  </div>

  <div id="topmid">
    <div id="level" class="glass chip"><i class="dot"></i><span id="level-text">--</span></div>
    <button id="btn-pause" class="glass iconbtn fx" data-webui-touch aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
  </div>

  <!-- HTML -> Godot: this button only asks; Godot decides how much damage happens. -->
  <div id="debug" class="glass">
    <div class="cap">GODOT TELEMETRY</div>
    <div class="grid mono">
      <span>pos</span><b id="r-pos">--</b>
      <span>vel</span><b id="r-vel">--</b>
      <span>floor</span><b id="r-floor">--</b>
      <span>attack</span><b id="r-atk">--</b>
    </div>
    <button id="btn-damage" class="hurt fx" data-webui-touch><svg><use href="#i-bolt"/></svg>Hurt me (Godot)</button>
  </div>

  <div id="toast"><small>NOW ENTERING</small><b id="toast-text"></b></div>

  <div id="stick-zone" data-webui-touch>
    <div id="stick">
      <i class="arr u"></i><i class="arr d"></i><i class="arr l"></i><i class="arr r"></i>
      <div id="knob"></div>
    </div>
  </div>

  <button id="btn-attack" class="act atk fx" data-webui-touch><svg><use href="#i-slash"/></svg><span>ATTACK</span></button>
  <button id="btn-jump" class="act jmp fx" data-webui-touch><svg><use href="#i-jump"/></svg><span>JUMP</span></button>

  <div id="pause" hidden>
    <div class="card" data-webui-touch>
      <div class="cap">GAME PAUSED</div>
      <h2>Take a breath</h2>
      <button id="btn-resume" class="cta fx"><svg><use href="#i-chev"/></svg>Resume</button>
      <button id="btn-menu" class="ghost fx">Main menu</button>
    </div>
  </div>

  <div id="ko" hidden>
    <b>K.O.</b>
    <div class="respawn"><i></i></div>
    <small>Godot is respawning you...</small>
  </div>

  <script src="hud.js"></script>
</body>
</html>
