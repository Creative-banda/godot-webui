<svg xmlns="http://www.w3.org/2000/svg" width="44" height="58" viewBox="0 0 44 58">
  <!-- The Seed Keeper: a small acorn-bodied grove keeper with a leaf hood and a lantern stick. -->
  <!-- feet -->
  <ellipse cx="16" cy="54.5" rx="5" ry="3" fill="#2a2140"/>
  <ellipse cx="28" cy="54.5" rx="5" ry="3" fill="#2a2140"/>
  <!-- lantern stick (held on the right, tip up) -->
  <path d="M31 40 Q35 30 33 20" fill="none" stroke="#5a4630" stroke-width="2.4" stroke-linecap="round"/>
  <!-- lantern body -->
  <rect x="29" y="12" width="9" height="11" rx="3" fill="#3a3020" stroke="#241c10" stroke-width="1"/>
  <rect x="31" y="14.5" width="5" height="6" rx="1.6" fill="#ffcf7a"/>
  <rect x="31.9" y="15.6" width="3.2" height="3.8" rx="1.1" fill="#fff3d0"/>
  <path d="M31 12 Q33.5 8.5 36 12" fill="none" stroke="#3a3020" stroke-width="1.6" stroke-linecap="round"/>
  <!-- acorn body -->
  <path d="M22 16 C31 16 34 23 33.4 33 C33 43 29 50 22 50 C15 50 11 43 10.6 33 C10 23 13 16 22 16 Z"
        fill="#f2e6c8" stroke="#2a2140" stroke-width="2"/>
  <!-- belly shade -->
  <path d="M22 24 C27 24 29.5 29 29.2 35 C29 41 26.5 45 22 45 C17.5 45 15 41 14.8 35 C14.5 29 17 24 22 24 Z"
        fill="#e8d5ac"/>
  <!-- eyes -->
  <circle cx="17.6" cy="27" r="2.2" fill="#2a2140"/>
  <circle cx="26.4" cy="27" r="2.2" fill="#2a2140"/>
  <circle cx="18.3" cy="26.3" r="0.7" fill="#ffffff"/>
  <circle cx="27.1" cy="26.3" r="0.7" fill="#ffffff"/>
  <!-- tiny smile -->
  <path d="M19.6 31.5 Q22 33.4 24.4 31.5" fill="none" stroke="#2a2140" stroke-width="1.4" stroke-linecap="round"/>
  <!-- leaf hood -->
  <path d="M9.5 22 C9 13 14 7.5 22 7.5 C30 7.5 35 13 34.5 22 C30 17.5 26 15.5 22 15.5 C18 15.5 14 17.5 9.5 22 Z"
        fill="#3e7d5f" stroke="#2a2140" stroke-width="2"/>
  <!-- hood stem-leaf -->
  <path d="M22 8 C22 5 24 3 27 2.6 C26.6 5.4 25 7.6 22 8 Z" fill="#4c9a74" stroke="#2a2140" stroke-width="1.4"/>
</svg>
