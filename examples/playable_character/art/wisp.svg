<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- A hollow wisp: a restless violet flame that drifted in from the deep woods. -->
  <defs>
    <radialGradient id="wisp-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b45cff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#b45cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b45cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="34" r="30" fill="url(#wisp-aura)"/>
  <!-- twin-tailed flame -->
  <path d="M32 6 C40 14 46 22 46 33 C46 44 40 52 32 52 C24 52 18 44 18 33 C18 22 24 14 32 6 Z"
        fill="#8d3fe0" stroke="#5b23a0" stroke-width="1.6"/>
  <!-- side tails -->
  <path d="M20 38 C14 40 11 44 10.5 49 C15 48 19 45 21 42 Z" fill="#8d3fe0" stroke="#5b23a0" stroke-width="1.3"/>
  <path d="M44 38 C50 40 53 44 53.5 49 C49 48 45 45 43 42 Z" fill="#8d3fe0" stroke="#5b23a0" stroke-width="1.3"/>
  <!-- inner flame -->
  <path d="M32 16 C37 22 40 27 40 34 C40 41 36.6 46 32 46 C27.4 46 24 41 24 34 C24 27 27 22 32 16 Z"
        fill="#c98bff"/>
  <!-- core -->
  <ellipse cx="32" cy="37" rx="6" ry="9" fill="#f2e0ff"/>
  <circle cx="32" cy="34" r="3" fill="#ffffff"/>
  <!-- two dark eyes, slightly mischievous -->
  <circle cx="27.5" cy="30" r="1.9" fill="#3a1d66"/>
  <circle cx="36.5" cy="30" r="1.9" fill="#3a1d66"/>
</svg>
