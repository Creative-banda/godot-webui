  </defs>
  <circle cx="90" cy="90" r="86" fill="url(#moon-halo)"/>
  <circle cx="90" cy="90" r="44" fill="#f2ecd8" stroke="#d8d0b4" stroke-width="2"/>
  <circle cx="74" cy="78" r="8" fill="#e2dabd"/>
  <circle cx="102" cy="96" r="5.5" fill="#e2dabd"/>
  <circle cx="88" cy="110" r="4" fill="#e6dfc4"/>
