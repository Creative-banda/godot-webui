      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#ffb84d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="26" cy="30" rx="25" ry="24" fill="url(#cap-light)"/>
  <!-- stem -->
